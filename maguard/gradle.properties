# Gradle daemonに割り当てるヒープ。デフォルトのままだと大きめのプロジェクトで遅い。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX を使うために必須。これが無いと
# 「AndroidX dependencies だが android.useAndroidX が有効になっていない」
# というエラーでビルド自体が失敗する。
android.useAndroidX=true

# R クラスを各モジュールで分離する（AGP 8系のデフォルトと合わせる）
android.nonTransitiveRClass=true

kotlin.code.style=official
